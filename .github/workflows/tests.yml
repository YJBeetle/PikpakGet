name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: lint (stdlib-only package; unused imports/vars are the realistic bugs)
        run: |
          pip install -q pyflakes
          python -m pyflakes pikpakget/*.py tests/*.py
      - name: installable, and the console script runs
        run: |
          pip install -q -e .
          pikpakget --version
      # the suite is pure logic: no account, no network, no fixtures to leak
      - run: python -m unittest discover -s tests -t . -v
